name: CI

# Two jobs.
#
#   tests  the JVM unit tests -- no Rust, no NDK, no emulator. They read the
#          tsbridge submodule from disk (its header and its event table), so the
#          checkout has to be recursive, but nothing has to be compiled.
#
#   apk    the real integration: `assembleDebug`, which runs
#          `buildTsbridgeJniDebug` (cargo ndk against the submodule, android-dev
#          profile) and packages the result. This used to be a hand-run copy step
#          from a committed binary; the job exists to keep it that way no longer.
#
# Both jobs cache what they can: without it, every run re-downloads the Gradle
# distribution and recompiles every source from scratch. Gradle User Home is
# restored by setup-gradle, and each `buildTsbridgeJni*` variant is a
# `@CacheableTask`, so a run where the submodule did not move restores the
# compiled `.so` instead of rebuilding it.
#
# Deliberately absent: an emulator job. There is no instrumentation test to run,
# and a booted emulator would cost minutes per run to prove nothing the JVM
# suite does not already pin.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: jvm unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # ServerEventTest parses third_party/tsbridge/docs/events.md and
          # NativeAbiTest parses include/tsbridge.h. Without the submodule they
          # fail with "submodule missing" instead of skipping, which is the
          # intended behaviour: a test that cannot see the contract is not a test.
          submodules: recursive

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # The default (`enhanced`) provider, not `basic`. Basic has no restore keys:
      # any edit to a build file changes the key and the next run starts from an
      # empty Gradle User Home. Enhanced keeps partial reuse across such edits and
      # is free for public repositories, which this one is.
      - uses: gradle/actions/setup-gradle@v6

      # The Apache-2.0 notice obligation covers the *binary* that ships, not the
      # source tree it came from, so the copies under assets/ have to be the
      # ones tsbridge's NOTICE refers to. A byte-for-byte check is the only
      # version of this that cannot silently rot when the submodule is bumped.
      - name: Licenses match the submodule
        run: |
          for f in LICENSE-APACHE LICENSE-MIT NOTICE; do
            cmp "app/src/main/assets/licenses/$f" "third_party/tsbridge/$f" \
              || { echo "assets/licenses/$f differs from the tsbridge submodule"; exit 1; }
          done
          echo "license texts match tsbridge@$(git -C third_party/tsbridge rev-parse --short HEAD)"

      # `testDebugUnitTest` has no dependency on `buildTsbridgeJni*`, and no
      # `.so` exists on this runner at all. So a test that reached into the
      # native library would fail here with UnsatisfiedLinkError rather than
      # pass on a binary some earlier step happened to leave behind.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

  apk:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # setup-gradle keys its cache by job id, so this job keeps its own Gradle
      # User Home entry rather than literally sharing the `tests` one (the
      # last-resort restore key can still borrow it). Without this step the job
      # re-downloaded the distribution and recompiled every Kotlin source and
      # re-dexed every dependency on every push.
      - uses: gradle/actions/setup-gradle@v6

      # The submodule pins its own toolchain in `rust-toolchain.toml`; naming the
      # same version here keeps the cache key stable and makes the version the
      # job claims to use visible in the log. The tag is the version itself, so
      # this does not drift the way `@master` does.
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-linux-android

      # Only useful on a run where the JNI library has to be rebuilt (the
      # submodule moved). When it does not, `buildTsbridgeJniDebug` is a cache
      # hit and none of this runs; when it does, the registry and `target/` are
      # already warm and only the changed crates compile.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/tsbridge -> target
          shared-key: apk

      # The version this project is built and tested with. A floating "latest"
      # would swap the sysroot under a fixed toolchain.
      #
      # `local-cache` is deliberately off: it would put the ~2.5 GB extracted
      # NDK in the same 10 GB Actions cache as Gradle and the Rust target
      # directory, and buying back the 23 s download would risk evicting entries
      # that save minutes.
      - name: Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      # `build.gradle.kts` reads ANDROID_NDK_HOME first and falls back to the
      # newest NDK in the SDK, so this both selects the NDK and keeps the Gradle
      # task in agreement with CI. Without it the task would pick whatever the
      # runner image ships (29 or 30 on ubuntu-latest).
      - name: Point Gradle at the NDK
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@4.1.2

      # CMake and Ninja are on the runner image; Opus needs both. The policy
      # escape hatch is required because Opus's CMakeLists predates CMake 3.5.
      - name: Build the APK
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          CMAKE_GENERATOR: Ninja
        run: ./gradlew :app:assembleDebug --no-daemon

      # Proves the wiring, not just that a file appeared: the packaged `.so`
      # has to be byte-identical to the stripped artifact Gradle derived from
      # the cargo task, or something else (a stale source set, a leftover
      # jniLibs directory) supplied it. The cargo output itself is not the
      # comparison target: Android's strip task rewrites the ELF header and
      # section table (sixteen bytes on the debug profile), while the loadable
      # code is unchanged.
      - name: Check the packaged library
        run: |
          generated=app/build/generated/tsbridgeJniLibs/debug/arm64-v8a/libtsbridge_jni.so
          stripped=app/build/intermediates/stripped_native_libs/debug/stripDebugDebugSymbols/out/lib/arm64-v8a/libtsbridge_jni.so
          test -f "$generated" || { echo "the cargo task produced nothing"; exit 1; }
          test -f "$stripped" || { echo "the strip task produced nothing"; exit 1; }

          apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          unzip -p "$apk" lib/arm64-v8a/libtsbridge_jni.so > packaged.so
          cmp -s "$stripped" packaged.so \
            || { echo "the APK does not contain the library Gradle just built"; exit 1; }

          size=$(stat -c %s "$generated")
          echo "packaged libtsbridge_jni.so: $size bytes"
          # A stub or a truncated file would also compare equal; this bounds it.
          test "$size" -gt 4000000

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          # The APK is already deflated; zipping it again spends time to save
          # nothing, and this artifact is downloaded on every run.
          compression-level: 0
