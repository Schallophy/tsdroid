[package]
name = "tsdroid-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "JNI bridge for TS6 Droid — TeamSpeak 3/6 client protocol on tsclientlib"

# Produces libtsdroid_core.so; the Kotlin side calls System.loadLibrary("tsdroid_core").
# Not named after the old library on purpose: this is a new implementation, and a
# same-named .so would make it impossible to tell the two apart in a crash log.
[lib]
name = "tsdroid_core"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
# Pinned: the whole point of this rewrite is a reproducible build. A floating git
# dependency means two builds of the same commit can produce different libraries.
tsclientlib = { git = "https://github.com/ReSpeak/tsclientlib.git", rev = "ee3bc6f45a7137db7793ba5593a321df400d53e5" }
# Not re-exported by tsclientlib, but needed to build outgoing audio packets.
tsproto-packets = { git = "https://github.com/ReSpeak/tsclientlib.git", rev = "ee3bc6f45a7137db7793ba5593a321df400d53e5" }
# Needed to tell "wrong server password" apart from every other way a server can
# refuse a connection: `Error::ConnectTs` carries this enum, and matching on it
# is the only way to show a useful message instead of an English enum name.
tsproto-types = { git = "https://github.com/ReSpeak/tsclientlib.git", rev = "ee3bc6f45a7137db7793ba5593a321df400d53e5" }
audiopus = "0.3.0-rc.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "fs", "io-util", "net"] }
futures = "0.3"
log = "0.4"
android_logger = "0.14"
# The state snapshot crosses the JNI boundary as JSON: one string instead of
# hundreds of HashMap insertions per frame.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# DNS resolution on Android goes through `hickory-resolver`, which asks the
# system `ConnectivityManager` for the current nameservers. It reaches them via
# `ndk-context`, which must be initialized from `JNI_OnLoad` — without it every
# name lookup panics with "android context was not initialized" and the
# connection thread dies right after "Connected to …".
ndk-context = "0.1"

[profile.release]
# Matches what the previous library was built with: a 12 MB .so, not 40 MB.
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
# `unwind`, not `abort`. With abort, one panicking `unwrap` inside the protocol
# stack kills the whole app with a SIGABRT that names no cause — the crash looks
# like "connecting closes the app" and there is nothing to read afterwards.
# Unwinding lets the JNI boundary catch it and report it as an error event.
panic = "unwind"
